<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="643" viewBox="0 0 1000 643" role="img" aria-label="The thread. Projects and internships so far have left me with one mental model for any AI system: Break it: Find out how cheaply it can be compromised. Look inside: A black-box test can&#x27;t catch what a model hides. Open up the layers and look. Audit it: Failures hide in the details. Catch them there, then decide. Build it: Build the kind of systems I want to understand, research or not.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#121a26"/></linearGradient></defs>
<rect width="1000" height="643" rx="16" fill="url(#bg)"/>
<text x="56" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="3" fill="#f5a524">THE THREAD</text>
<text x="56" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#d7dde4">Projects and internships so far have left me with one mental model</text>
<text x="56" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#d7dde4">for any AI system:</text>
<text x="56" y="210.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#f5a524" opacity=".7">01</text><text x="104" y="210.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#f5a524">Break it</text>
<text x="104" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b97a6">Find out how cheaply it can be compromised.</text>
<text x="56" y="311.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#58a6ff" opacity=".7">02</text><text x="104" y="311.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#58a6ff">Look inside</text>
<text x="104" y="349" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b97a6">A black-box test can&#x27;t catch what a model hides. Open up the layers</text>
<text x="104" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b97a6">and look.</text>
<text x="56" y="445.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#3fb950" opacity=".7">03</text><text x="104" y="445.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#3fb950">Audit it</text>
<text x="104" y="483" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b97a6">Failures hide in the details. Catch them there, then decide.</text>
<text x="56" y="546.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#d2a8ff" opacity=".7">04</text><text x="104" y="546.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#d2a8ff">Build it</text>
<text x="104" y="584" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b97a6">Build the kind of systems I want to understand, research or not.</text>

</svg>