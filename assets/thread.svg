<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="607" viewBox="0 0 1000 607" role="img" aria-label="The thread. So far, I keep asking the same four things about any AI system: Break it: Can I break it? How easily? Look inside: What is actually going on in there? You can&#x27;t tell from the outside, so open it up and look. Audit it: Is it really doing what it says it does? Check the small stuff. Build it: Can I make one myself? Sometimes I just like building things.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#121a26"/></linearGradient></defs>
<rect width="1000" height="607" rx="16" fill="url(#bg)"/>
<text x="56" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="3" fill="#f5a524">THE THREAD</text>
<text x="56" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#d7dde4">So far, I keep asking the same four things about any AI system:</text>
<text x="56" y="174.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#f5a524" opacity=".7">01</text><text x="104" y="174.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#f5a524">Break it</text>
<text x="104" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b97a6">Can I break it? How easily?</text>
<text x="56" y="275.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#58a6ff" opacity=".7">02</text><text x="104" y="275.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#58a6ff">Look inside</text>
<text x="104" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b97a6">What is actually going on in there? You can&#x27;t tell from the outside,</text>
<text x="104" y="346" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b97a6">so open it up and look.</text>
<text x="56" y="409.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#3fb950" opacity=".7">03</text><text x="104" y="409.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#3fb950">Audit it</text>
<text x="104" y="447" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b97a6">Is it really doing what it says it does? Check the small stuff.</text>
<text x="56" y="510.0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#d2a8ff" opacity=".7">04</text><text x="104" y="510.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#d2a8ff">Build it</text>
<text x="104" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b97a6">Can I make one myself? Sometimes I just like building things.</text>

</svg>